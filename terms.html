<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms of Service - PromptShield</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#fff; --bg-alt:#f5f5f7; --text:#1d1d1f; --text-2:#6e6e73; --text-3:#86868b;
            --border:#d2d2d7; --accent:#008a5e; --accent-hover:#00754e; --accent-soft:rgba(0,138,94,.10);
            --radius:18px; --maxw:760px;
            --font:-apple-system, BlinkMacSystemFont, "SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth}
        body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
        a{color:inherit}
        nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
        .nav-inner{max-width:var(--maxw);margin:0 auto;padding:0 22px;height:52px;display:flex;align-items:center;justify-content:space-between}
        .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px;letter-spacing:-.02em}
        .brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center}
        .brand .logo svg{width:16px;height:16px;color:#fff}
        .nav-right{display:flex;align-items:center;gap:22px}
        .back{font-size:13px;color:var(--text-2);transition:color .2s}
        .back:hover{color:var(--text)}
        .lang-toggle{font-size:13px;font-weight:500;color:var(--text);border:1px solid var(--border);border-radius:980px;padding:5px 14px;cursor:pointer;background:transparent;transition:all .2s;font-family:var(--font)}
        .lang-toggle:hover{border-color:var(--text-3);background:var(--bg-alt)}
        main{max-width:var(--maxw);margin:0 auto;padding:72px 22px 40px}
        h1.page-title{font-size:clamp(32px,5vw,46px);font-weight:600;letter-spacing:-.025em;margin-bottom:8px}
        .updated{font-size:14px;color:var(--text-3);margin-bottom:44px}
        .legal-section{margin-bottom:34px}
        .legal-section h2{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-bottom:12px}
        .legal-section p{font-size:16px;color:var(--text-2)}
        .legal-section ul{list-style:none;margin-top:10px}
        .legal-section li{font-size:16px;color:var(--text-2);padding:7px 0 7px 22px;position:relative}
        .legal-section li::before{content:"";position:absolute;left:4px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
        .legal-section a{color:var(--accent)}
        .legal-section strong{color:var(--text);font-weight:600}
        footer{border-top:1px solid var(--border);background:var(--bg-alt);padding:30px 0;margin-top:40px}
        .foot-inner{max-width:var(--maxw);margin:0 auto;padding:0 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
        .foot-inner .copy{font-size:13px;color:var(--text-3)}
        .foot-links{display:flex;gap:24px;font-size:13px}
        .foot-links a{color:var(--text-2);transition:color .2s}
        .foot-links a:hover{color:var(--accent)}
    </style>
</head>
<body>

    <nav>
        <div class="nav-inner">
            <a href="index.html" class="brand">
                <span class="logo"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg></span>
                PromptShield
            </a>
            <div class="nav-right">
                <a href="index.html" class="back" data-i18n="back">← Back to home</a>
                <button id="langToggle" class="lang-toggle" onclick="toggleLang()">中文</button>
            </div>
        </div>
    </nav>

    <main>
        <h1 class="page-title" id="pageTitle">Terms of Service</h1>
        <p class="updated" id="pageUpdated"></p>
        <div id="legal-content"></div>
    </main>

    <footer>
        <div class="foot-inner">
            <div class="copy" data-i18n="footer.text">PromptShield · Built by an indie hacker shipping in public · 2026</div>
            <div class="foot-links">
                <a href="index.html" data-i18n="nav.home">Home</a>
                <a href="privacy.html" data-i18n="footer.privacy">Privacy</a>
                <a href="https://github.com/Klay-max" target="_blank" data-i18n="footer.github">GitHub</a>
            </div>
        </div>
    </footer>

    <script>

            },
            zh:{

        };
        const LEGAL = {

                    { h:'3. License & Permitted Use', html:'<ul>'
                        + '<li><strong>Free templates</strong>: granted under a perpetual, non-exclusive, royalty-free license. You may use, modify, and integrate them into commercial or non-commercial projects.</li>'

                    { h:'5. Limitation of Liability', p:'To the maximum extent permitted by law, PromptShield and its operator are not liable for any indirect, incidental, or consequential damages arising from your use of the templates or the Service. Our total liability is limited to the amount you paid for Lifetime access.' },
                    { h:'6. Refund Policy', html:'Lifetime purchases include a 14-day refund from the date of purchase. To request a refund, email <a href="mailto:darwin152140@gmail.com">darwin152140@gmail.com</a>; refunds are processed through Creem to your original payment method. After a refund, your license to the Lifetime templates is revoked.' },
                    { h:'7. Termination', p:'We may terminate or suspend your license if you breach these Terms (for example, by redistributing or reselling the templates). You may stop using the Service at any time. Sections that by nature should survive (license restrictions, disclaimers, limitation of liability) remain in effect.' },
                    { h:'8. Governing Law', p:'These Terms are governed by the laws of Singapore, without regard to conflict-of-law principles. Creem acts as our Merchant of Record for payment processing.' }
                ]
            },
            zh:{
                title:'服务条款', updated:'最后更新：2026年8月20日',
                sections:[
                    { h:'1. 条款的接受', p:'访问或使用 PromptShield（"本服务"），即表示你同意受本服务条款约束。如不同意，请勿使用本服务。' },
                    { h:'2. 服务说明', p:'PromptShield 提供一套精心筛选的"抗幻觉"提示词模板库，面向构建 AI 应用的开发者。服务包含首页可用的免费模板，以及付费"终身版"（含更多模板与更新）。' },
                    { h:'3. 许可与使用范围', html:'<ul>'
                        + '<li><strong>免费模板</strong>：以永久、非独占、免版权费许可授予。你可在商业或非商业项目中自由使用、修改并集成。</li>'
                        + '<li><strong>终身模板</strong>：成功购买后，你获得在个人及商业项目中使用终身模板的永久、非独占许可。你不得转售、再分发或转许可这些模板作为独立产品，也不得借此运营竞争性提示词模板业务。</li>'
                        + '</ul>' },
                    { h:'4. 免责声明', p:'本服务按"现状"提供，不附带任何种类的保证。提示词模板只是写作辅助，不能替代专业判断。AI 生成的内容具有概率性，可能不完整或不准确。你须自行负责在使用前审查任何输出，尤其在法律、医疗、金融或安全相关场景中。模板中的任何内容均不构成法律、医疗或金融建议。' },
                    { h:'5. 责任限制', p:'在法律允许的最大范围内，PromptShield 及其运营者不对你因使用模板或服务而产生的任何间接、附带或后果性损害承担责任。我们的总责任以你为终身版支付的金额为限。' },
                    { h:'6. 退款政策', html:'终身版购买自购买日起含 14 天退款。如需退款，请发邮件至 <a href="mailto:darwin152140@gmail.com">darwin152140@gmail.com</a>；退款经 Creem 原路退回你的付款方式。退款后，你对终身模板的许可即被撤销。' },
                    { h:'7. 终止', p:'若你违反本条款（例如再分发或转售模板），我们可终止或暂停你的许可。你可随时停止使用本服务。性质上应当存续的条款（许可限制、免责声明、责任限制）继续有效。' },
                    { h:'8. 适用法律', p:'本条款受新加坡法律管辖，不考虑法律冲突原则。Creem 作为我们的收款商户（Merchant of Record）处理支付。' }
                ]
            }
        };

        const LS_KEY='ps-lang';
        let lang = localStorage.getItem(LS_KEY) || 'en';

        function t(k){ return (I18N[lang] && I18N[lang][k]!=null) ? I18N[lang][k] : k; }

        function render(){
            document.documentElement.lang = (lang==='zh') ? 'zh-CN' : 'en';
            document.querySelectorAll('[data-i18n]').forEach(el=> el.textContent = t(el.getAttribute('data-i18n')));
            document.getElementById('langToggle').textContent = t('lang.toggle');
            const d = LEGAL[lang];
            document.getElementById('pageTitle').textContent = d.title;
            document.getElementById('pageUpdated').textContent = d.updated;
            document.getElementById('legal-content').innerHTML = d.sections.map(s=>{
                const body = s.html ? s.html : `<p>${s.p}</p>`;
                return `<section class="legal-section"><h2>${s.h}</h2>${body}</section>`;
            }).join('');
        }

        function toggleLang(){
            lang = (lang==='en') ? 'zh' : 'en';
            localStorage.setItem(LS_KEY, lang);
            render();
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
